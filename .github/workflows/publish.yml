name: Publish

on:
  push:
    branches:
      - latest
      - beta

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write # push the release commit + git tag, create the GitHub release
      issues: write # semantic-release/github comments on released issues
      pull-requests: write # semantic-release/github comments on released PRs
      id-token: write # npm provenance / OIDC

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
