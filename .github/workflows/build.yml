name: Build and Lint

on:
  push:
      branches:
        - latest
        - beta
        - dev
  pull_request:
      branches:
          - latest
          - beta
          - dev
      types:
        - labeled
        - unlabeled
        - opened
        - ready_for_review
        - reopened
        - synchronize
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint the project
        run: npm run lint

      - name: Build the project
        run: npm run build

      - name: Run tests
        run: npm test

      - name: List, audit, fix outdated dependencies and build again
        run: |
          npm list --outdated
          npm audit || true  # ignore failures
          npm audit fix || true
          npm list --outdated
          npm run build

  publish:
    needs:
      - build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    if: github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'test-publish')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: sh scripts/ci/publish.sh
        working-directory: .
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
