name: PR Title

# Squash-merged PRs use the PR title as the commit message, which is what
# semantic-release analyses to decide the next version. This enforces that
# the title is a valid Conventional Commit so releases are never missed or
# mis-versioned. Add this check to the required status checks for beta/latest.

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
    branches:
      - dev
      - beta
      - latest

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
